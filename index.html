<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الرنين الفوري</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .ring-btn {
            background-color: #ff3b30;
            color: white;
            border: none;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 59, 48, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }
        .ring-btn:active {
            transform: scale(0.95);
            background-color: #d32f2f;
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>

    <button class="ring-btn" id="alarmBtn">اضغط للرنين</button>
    <div id="status">جاهز للتنبيه</div>

    <audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const btn = document.getElementById('alarmBtn');
        const audio = document.getElementById('alarmSound');
        const statusDiv = document.getElementById('status');
        let ringTimeout = null;

        btn.addEventListener('click', () => {
            socket.emit('trigger-ring');
            statusDiv.innerText = "تم إرسال إشارة الرنين...";
            btn.disabled = true;

            setTimeout(() => {
                btn.disabled = false;
                statusDiv.innerText = "جاهز للتنبيه";
            }, 10000);
        });

        socket.on('start-ringing', () => {
            statusDiv.innerText = "⚠️ تنبيه وارد! الهاتف يرن...";
            audio.currentTime = 0;
            audio.play().catch(e => console.log(e));

            if (ringTimeout) clearTimeout(ringTimeout);

            ringTimeout = setTimeout(() => {
                audio.pause();
                audio.currentTime = 0;
                statusDiv.innerText = "جاهز للتنبيه";
            }, 10000);
        });
    </script>
</body>
</html>
